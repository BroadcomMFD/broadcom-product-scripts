plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java {
	sourceCompatibility = JavaVersion.VERSION_17
}

// Overrides the vulnerable SnakeYAML version inherited by Spring Boot 2.7
ext['snakeyaml.version'] = '2.0'

repositories {
	mavenCentral()
	maven { setUrl('https://zowe.jfrog.io/zowe/libs-release/') }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	
	implementation "org.zowe.apiml.sdk:onboarding-enabler-spring:3.6.6"
	
	// Upgraded to patch Guava and Jackson vulnerabilities
	implementation "io.springfox:springfox-swagger2:2.9.2"
	implementation "io.springfox:springfox-spring-web:2.9.2"
	implementation 'io.swagger.core.v3:swagger-jaxrs2:2.2.15'
	
	// Minor bump to prevent older Lombok execution issues on newer build servers
	implementation "org.projectlombok:lombok:1.18.30"
	annotationProcessor "org.projectlombok:lombok:1.18.30"

	// Required by the onboarding-enabler logback-spring.xml (OpenTelemetry appender)
	implementation "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.34.0-alpha"

	implementation "com.google.guava:guava:33.7.2-jre"
	implementation "org.apache.commons:commons-lang3:3.18.0"
}

tasks.named('test') {
	useJUnitPlatform()
}
