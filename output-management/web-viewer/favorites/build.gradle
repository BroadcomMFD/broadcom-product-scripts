group = 'com.broadcom.msd.om.sample.favorites'
version = '1.0.0'

repositories {
    mavenLocal()
}

task printVersion {
    doLast {
        print project.version
    }
}

// The sdk subproject generated by openapi-generator-cli declares junit-jupiter-engine for its tests
// but not the junit-platform-launcher. This used to be silently added by Gradle before version 9.
project(':sdk') {
    afterEvaluate {
        dependencies {
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
}
